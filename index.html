<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0e7c7b">
<title>Care List</title>
<link rel="icon" href="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=flat%20minimalist%20app%20icon%20of%20a%20doctor%20wearing%20white%20coat%20and%20stethoscope%2C%20teal%20background%2C%20vector%20style%2C%20medical%20cross%20badge%2C%20rounded%20square&image_size=square">
<link rel="apple-touch-icon" href="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=flat%20minimalist%20app%20icon%20of%20a%20doctor%20wearing%20white%20coat%20and%20stethoscope%2C%20teal%20background%2C%20vector%20style%2C%20medical%20cross%20badge%2C%20rounded%20square&image_size=square">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --teal:#0e7c7b; --teal-dark:#0a5f5e; --teal-light:#e0f2f1;
    --bg:#f4f6f8; --card:#ffffff; --text:#1f2d3d; --muted:#8a97a5;
    --danger:#d9534f; --line:#e5eaf0; --accent:#1976d2; --warn:#e6a23c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.5;}
  /* ---------- header ---------- */
  .app-header{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;
    padding:12px 16px;display:flex;align-items:center;gap:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .app-header img{width:34px;height:34px;border-radius:8px;background:#fff;}
  .app-header .title{font-size:18px;font-weight:700;letter-spacing:.5px;}
  .app-header .sub{font-size:11px;opacity:.85;}
  .app-header .hdr-spacer{flex:1;}
  .hdr-btn{border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);color:#fff;
    border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
  .hdr-btn:active{background:rgba(255,255,255,.25);}
  /* ---------- views ---------- */
  .view{display:none;min-height:calc(100vh - 120px);padding-bottom:90px;}
  .view.active{display:block;}
  /* ---------- patient cards ---------- */
  .plist{padding:12px;}
  .pcard{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;align-items:center;gap:12px;}
  .pcard .avatar{width:46px;height:46px;border-radius:50%;background:var(--teal-light);
    color:var(--teal);display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;flex-shrink:0;}
  .pcard .info{flex:1;min-width:0;}
  .pcard .row1{font-weight:700;font-size:16px;}
  .pcard .row1 .bed{color:var(--teal);margin-left:8px;font-size:14px;}
  .pcard .row2{color:var(--muted);font-size:12.5px;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pcard .chev{color:var(--muted);font-size:20px;}
  .pcard .badge-out{font-size:11px;background:#eee;color:#777;border-radius:4px;padding:1px 6px;margin-left:6px;}
  .share-btn{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:8px;
    width:36px;height:36px;font-size:16px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .share-btn:active{background:var(--teal-light);}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;}
  /* ---------- FAB ---------- */
  .fab{position:fixed;right:18px;bottom:84px;width:56px;height:56px;border-radius:50%;
    background:var(--teal);color:#fff;font-size:30px;border:none;z-index:30;
    box-shadow:0 4px 12px rgba(14,124,123,.4);display:flex;align-items:center;justify-content:center;}
  .fab:active{background:var(--teal-dark);}
  /* ---------- bottom nav ---------- */
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;
    border-top:1px solid var(--line);display:flex;z-index:25;}
  .bottom-nav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;color:var(--muted);font-size:12px;gap:2px;cursor:pointer;}
  .bottom-nav .nav-item.active{color:var(--teal);font-weight:600;}
  .bottom-nav .nav-item .ico{font-size:20px;}
  /* ---------- sub header ---------- */
  .sub-header{position:sticky;top:58px;z-index:15;background:var(--bg);
    padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);}
  .back-btn{border:none;background:none;font-size:22px;color:var(--teal);padding:0 6px 0 0;cursor:pointer;}
  .sub-header .h-title{font-weight:700;font-size:16px;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mini-btn{border:1px solid var(--teal);color:var(--teal);background:#fff;
    border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .mini-btn.danger{border-color:var(--danger);color:var(--danger);}
  /* ---------- carelist entries ---------- */
  .cl-item{background:var(--card);border-radius:12px;padding:14px;margin:0 12px 10px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;align-items:center;gap:12px;}
  .cl-item .day-num{width:52px;height:52px;border-radius:10px;background:var(--teal);
    color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
  .cl-item .day-num .d1{font-size:11px;opacity:.85;}
  .cl-item .day-num .d2{font-size:19px;font-weight:800;line-height:1.1;}
  .cl-item .cl-info{flex:1;}
  .cl-item .cl-date{font-weight:600;font-size:14.5px;}
  .cl-item .cl-meta{color:var(--muted);font-size:12px;margin-top:2px;}
  .today-tag{font-size:11px;background:#fff3cd;color:#8a6d00;border-radius:4px;padding:1px 6px;margin-left:6px;}
  /* ---------- form ---------- */
  .form-wrap{padding:12px;}
  .f-card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.07);}
  .f-title{font-weight:700;font-size:15px;color:var(--teal);margin:0 0 10px;
    padding-left:9px;border-left:4px solid var(--teal);}
  .f-title .tip{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:6px;}
  .f-row{display:flex;gap:10px;margin-bottom:10px;}
  .f-row:last-child{margin-bottom:0;}
  .f-field{flex:1;min-width:0;}
  .f-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .f-field input,.f-field textarea,.f-field select{width:100%;border:1px solid var(--line);
    border-radius:8px;padding:9px 10px;font-size:14.5px;font-family:inherit;background:#fbfcfd;
    color:var(--text);outline:none;}
  .f-field input:focus,.f-field textarea:focus{border-color:var(--teal);background:#fff;}
  .f-field textarea{min-height:74px;resize:vertical;}
  /* system accordion */
  .sys{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:#fff;}
  .sys-head{display:flex;align-items:center;padding:11px 12px;cursor:pointer;background:#fbfcfd;}
  .sys-head .name{font-weight:600;font-size:14.5px;flex:1;}
  .sys-head .stat{font-size:11.5px;color:var(--muted);margin-right:8px;}
  .sys-head .stat.has{color:var(--teal);font-weight:600;}
  .sys-head .arrow{color:var(--muted);transition:transform .2s;font-size:12px;}
  .sys.open .sys-head .arrow{transform:rotate(90deg);}
  .sys-body{display:none;padding:10px 12px 12px;border-top:1px dashed var(--line);}
  .sys.open .sys-body{display:block;}
  /* 逐项评估：评估选项 + 填写空 */
  .item-row{padding:8px 0;border-bottom:1px dashed #eef1f4;}
  .item-row:last-of-type{border-bottom:none;}
  .item-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;}
  .item-name{font-size:13.5px;font-weight:600;color:#3a4a5a;}
  .eval-group{display:flex;gap:6px;flex-shrink:0;}
  .eval-btn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:14px;
    padding:3px 12px;font-size:12px;cursor:pointer;font-family:inherit;line-height:1.5;}
  .eval-btn.on-normal{background:var(--teal-light);border-color:var(--teal);color:var(--teal-dark);font-weight:600;}
  .eval-btn.on-abnormal{background:#fdeceb;border-color:var(--danger);color:var(--danger);font-weight:600;}
  .item-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    font-size:13.5px;font-family:inherit;background:#fbfcfd;color:var(--text);outline:none;}
  .item-input:focus{border-color:var(--teal);background:#fff;}
  .extra-note{margin-top:10px;padding-top:10px;border-top:2px solid var(--teal-light);}
  .sys-ok-btn{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:12px;
    padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit;margin-right:8px;
    white-space:nowrap;flex-shrink:0;}
  .sys-ok-btn.on{background:var(--teal);color:#fff;}
  .item-input.hidden{display:none;}
  .item-name{cursor:pointer;}
  .item-name .edit-hint{font-size:10px;color:#c3ccd6;margin-left:4px;font-weight:400;}
  .item-name-static{font-size:13.5px;font-weight:600;color:#3a4a5a;}
  .chip-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px;}
  .chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:13px;
    padding:4px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;line-height:1.4;}
  .chip.on-n{background:var(--teal-light);border-color:var(--teal);color:var(--teal-dark);font-weight:600;}
  .chip.on-a{background:#fdeceb;border-color:var(--danger);color:var(--danger);font-weight:600;}
  .num-wrap{display:flex;align-items:center;gap:8px;padding:2px 0 4px;}
  .num-input{width:110px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;
    font-family:inherit;background:#fbfcfd;color:var(--text);outline:none;}
  .num-input:focus{border-color:var(--teal);background:#fff;}
  .num-unit{font-size:12.5px;color:var(--muted);}
  .item-input.ta{min-height:96px;resize:vertical;}
  .rx-input{min-height:170px;font-family:KaiTi,STKaiti,"Kaiti SC",serif;font-size:16px;line-height:2;
    background:#fffdf4;border:1.5px solid #d9c98a;border-radius:6px;padding:12px 14px;color:#3a3223;}
  .rx-input:focus{border-color:#b7a256;background:#fffdf8;}
  .diag-ta-ro{width:100%;resize:none;font-weight:600;color:#51606f;background:#f6f8fa;line-height:1.8;}
  .rx-fmt-btn{border:1px solid #b7a256;background:#f7f1dd;color:#7a6420;border-radius:8px;
    padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;margin-left:8px;white-space:nowrap;}
  .rx-fmt-btn:active{background:#efe4c3;}
  /* ---------- buttons ---------- */
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;
    font-weight:700;cursor:pointer;text-align:center;font-family:inherit;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:active{background:var(--teal-dark);}
  .btn-outline{background:#fff;color:var(--teal);border:1.5px solid var(--teal);}
  .btn-grey{background:#eef1f4;color:#5a6a7a;}
  .btn-danger{background:#fff;color:var(--danger);border:1.5px solid var(--danger);}
  /* ---------- modal ---------- */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
    display:none;align-items:center;justify-content:center;padding:24px;}
  .modal-mask.show{display:flex;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:420px;max-height:82vh;
    overflow-y:auto;padding:18px;}
  .modal .m-title{font-weight:700;font-size:17px;margin-bottom:4px;}
  .modal .m-sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
  .remind-item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:8px;}
  .remind-item .r-info{flex:1;}
  .remind-item .r-name{font-weight:600;}
  .remind-item .r-meta{font-size:12px;color:var(--muted);}
  .remind-item .r-btn{border:none;background:var(--teal);color:#fff;border-radius:8px;
    padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap;}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:rgba(30,40,50,.92);color:#fff;padding:10px 18px;border-radius:22px;
    font-size:13.5px;z-index:200;display:none;max-width:80%;text-align:center;}
  .section-gap{height:4px;}
  .patient-info-bar{margin:12px;background:linear-gradient(135deg,var(--teal),#129a97);
    border-radius:12px;color:#fff;padding:14px;}
  .patient-info-bar .p-name{font-size:19px;font-weight:800;}
  .patient-info-bar .p-meta{font-size:12.5px;opacity:.92;margin-top:4px;line-height:1.7;}
</style>
</head>
<body>

<!-- ======================= 顶部 ======================= -->
<div class="app-header">
  <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=flat%20minimalist%20app%20icon%20of%20a%20doctor%20wearing%20white%20coat%20and%20stethoscope%2C%20teal%20background%2C%20vector%20style%2C%20medical%20cross%20badge%2C%20rounded%20square&image_size=square" alt="icon">
  <div>
    <div class="title">Care List</div>
    <div class="sub">重症患者每日评估清单</div>
  </div>
  <div class="hdr-spacer"></div>
  <button class="hdr-btn" id="btn-backup">💾 备份</button>
  <button class="hdr-btn" id="btn-import">📥 导入</button>
</div>
<input type="file" id="import-file" accept=".json,application/json" style="display:none;">

<!-- ======================= HOME (在科) ======================= -->
<div id="view-home" class="view active">
  <div style="padding:10px 12px 0;">
    <input class="item-input" id="pt-search" style="width:100%;" placeholder="🔍 搜索姓名 / 床号 / 诊断…">
  </div>
  <div class="plist" id="active-list"></div>
  <button class="fab" id="fab-add">＋</button>
</div>

<!-- ======================= 已出 ======================= -->
<div id="view-discharged" class="view">
  <div style="padding:10px 12px 0;">
    <input class="item-input" id="pt-search-out" style="width:100%;" placeholder="🔍 搜索姓名 / 床号 / 诊断…">
  </div>
  <div class="plist" id="discharged-list"></div>
</div>

<!-- ======================= 文献参考库 ======================= -->
<div id="view-library" class="view">
  <div class="sub-header">
    <div class="h-title">文献参考库</div>
    <button class="mini-btn" id="btn-add-lit">＋ 添加文献</button>
  </div>
  <div style="padding:10px 12px 0;">
    <input class="item-input" id="lit-search" style="width:100%;" placeholder="搜索标题 / 来源 / 标签 / 笔记…">
  </div>
  <div class="plist" id="lit-list"></div>
</div>

<!-- ======================= 患者详情 ======================= -->
<div id="view-patient" class="view">
  <div class="sub-header">
    <button class="back-btn" data-nav="home">‹</button>
    <div class="h-title" id="pd-title">患者</div>
    <button class="mini-btn" id="btn-share-patient">分享</button>
    <button class="mini-btn" id="btn-edit-patient">编辑</button>
    <button class="mini-btn danger" id="btn-discharge">出院/转科</button>
  </div>
  <div class="patient-info-bar" id="pd-info"></div>
  <div style="padding:0 12px 10px;">
    <button class="btn btn-primary" id="btn-new-carelist">＋ 填写今日 CARE LIST</button>
  </div>
  <div id="cl-entries"></div>
</div>

<!-- ======================= 患者表单（新建/编辑） ======================= -->
<div id="view-pform" class="view">
  <div class="sub-header">
    <button class="back-btn" id="pform-back">‹</button>
    <div class="h-title" id="pform-title">新建患者</div>
  </div>
  <div class="form-wrap">
    <div class="f-card">
      <div class="f-row">
        <div class="f-field"><label>姓名 *</label><input id="pf-name" placeholder="患者姓名"></div>
        <div class="f-field"><label>床号 *</label><input id="pf-bed" placeholder="如 12床"></div>
      </div>
      <div class="f-row">
        <div class="f-field"><label>性别</label>
          <select id="pf-gender"><option>男</option><option>女</option></select></div>
        <div class="f-field"><label>年龄</label><input id="pf-age" type="number" placeholder="岁"></div>
      </div>
      <div class="f-row">
        <div class="f-field"><label>住院号</label><input id="pf-hospno" placeholder="选填"></div>
        <div class="f-field"><label>主管医师</label><input id="pf-doctor" placeholder="选填"></div>
      </div>
      <div class="f-row">
        <div class="f-field"><label>入院时间 *</label><input id="pf-admit" type="date"></div>
      </div>
      <div class="f-row">
        <div class="f-field"><label>入院诊断 *</label><textarea id="pf-diag" placeholder="如：重症肺炎、脓毒性休克"></textarea></div>
      </div>
      <div class="f-row">
        <div class="f-field"><label>现病史</label><textarea id="pf-hpi" placeholder="主诉、起病经过、院外诊治经过…"></textarea></div>
      </div>
      <div class="f-row">
        <div class="f-field"><label>既往史</label><textarea id="pf-past" placeholder="高血压、糖尿病、冠心病、手术史、药物过敏史…"></textarea></div>
      </div>
    </div>
    <button class="btn btn-primary" id="pf-save">保存</button>
    <div class="section-gap"></div>
    <button class="btn btn-danger" id="pf-delete" style="display:none;">删除该患者</button>
  </div>
</div>

<!-- ======================= CARE LIST 表单 ======================= -->
<div id="view-carelist" class="view">
  <div class="sub-header">
    <button class="back-btn" id="cl-back">‹</button>
    <div class="h-title" id="cl-title">CARE LIST</div>
  </div>
  <div class="form-wrap" id="cl-form"></div>
</div>

<!-- ======================= 底部导航 ======================= -->
<div class="bottom-nav" id="bottom-nav">
  <div class="nav-item active" data-nav="home"><div class="ico">🏥</div>在科患者</div>
  <div class="nav-item" data-nav="discharged"><div class="ico">📁</div>已出患者</div>
  <div class="nav-item" data-nav="library"><div class="ico">📚</div>文献库</div>
</div>

<!-- ======================= 智能辅助决策弹窗 ======================= -->
<div class="modal-mask" id="ai-mask">
  <div class="modal">
    <div class="m-title">🤖 智能辅助决策</div>
    <div class="m-sub">汇总患者基本信息、主要问题、诊断与辅助检查，用于咨询医疗 AI、检索相关指南与文献。</div>
    <button class="btn btn-primary" id="ai-copy" style="margin-bottom:10px;">复制问诊文本（剪贴板）</button>
    <button class="btn btn-outline" id="ai-doc" style="margin-bottom:10px;">下载 Word 文档（.doc）</button>
    <button class="btn btn-grey" id="ai-cancel">取消</button>
  </div>
</div>

<!-- ======================= 文献编辑弹窗 ======================= -->
<div class="modal-mask" id="lit-mask">
  <div class="modal">
    <div class="m-title" id="lit-mtitle">添加文献</div>
    <div class="m-sub">记录有用的指南、专家共识、文献等参考资料</div>
    <div class="f-field"><label>标题 *</label><input id="lit-title" placeholder="如：脓毒症拯救运动指南 2021"></div>
    <div class="f-row">
      <div class="f-field"><label>分类</label><select id="lit-tag"><option>指南</option><option>专家共识</option><option>文献</option><option>其他</option></select></div>
      <div class="f-field"><label>来源 / 期刊</label><input id="lit-src" placeholder="如：NEJM 2024"></div>
    </div>
    <div class="f-field" style="margin-bottom:10px;"><label>链接（选填）</label><input id="lit-url" placeholder="https://…"></div>
    <div class="f-field" style="margin-bottom:12px;"><label>要点笔记</label><textarea id="lit-note" style="min-height:110px;" placeholder="核心结论、适用人群、关键数据、个体化要点…"></textarea></div>
    <button class="btn btn-primary" id="lit-save" style="margin-bottom:10px;">保存</button>
    <button class="btn btn-danger" id="lit-del" style="display:none;margin-bottom:10px;">删除</button>
    <div class="section-gap"></div>

    <div class="m-title">今日 CARE LIST 提醒</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Care List —— 重症患者每日评估清单
   数据存储：localStorage（仅保存在本机浏览器）
   ============================================================ */

// ---------- 模板：13 个评估系统 ----------
// 条目类型：字符串/'eval'=正常异常+填写框 | num=数值+单位 | choice=选项(自动判正常异常) | text=多行文本 | rx=中药处方
const SYSTEMS = [
  { key:'neuro', name:'神经系统', items:[
    { n:'意识状态', t:'choice', opts:[['清楚',1],['模糊',0],['嗜睡',0],['昏睡',0],['浅昏迷',0],['中昏迷',0],['深昏迷',0]] },
    { n:'GCS评分', t:'num', unit:'分' },
    { n:'RASS镇静评分', t:'num', unit:'分' },
    { n:'瞳孔对光反射', t:'choice', opts:[['灵敏',1],['迟钝',0],['消失',0]] },
    { n:'双侧瞳孔', t:'choice', opts:[['等大等圆',1],['不等大',0],['单侧散大',0],['针尖样',0]] },
    { n:'肢体肌力', t:'choice', opts:[['Ⅴ级（正常）',1],['Ⅳ级',0],['Ⅲ级',0],['Ⅱ级',0],['Ⅰ级',0],['0级',0]] },
    { n:'谵妄 CAM-ICU', t:'choice', opts:[['阴性',1],['阳性',0]] },
    { n:'抽搐发作', t:'choice', opts:[['无',1],['有',0]] },
    '颅内情况（脑水肿 / 颅高压 / 影像变化等）' ] },
  { key:'resp', name:'呼吸系统', items:[
    { n:'气道方式', t:'choice', opts:[['自主气道',1],['气管插管',0],['气管切开',0]] },
    { n:'SpO₂', t:'num', unit:'%' },
    { n:'FiO₂', t:'num', unit:'%' },
    { n:'氧合指数', t:'num', unit:'mmHg' },
    { n:'痰液性状', t:'choice', opts:[['少白稀',1],['多白黏',0],['黄脓痰',0],['血性痰',0]] },
    { n:'双肺听诊', t:'choice', opts:[['呼吸音清',1],['湿啰音',0],['干啰音',0],['呼吸音减低',0]] },
    '呼吸机模式与参数 / SBT脱机评估、床头抬高30°' ] },
  { key:'circ', name:'循环系统', items:[
    { n:'血压', t:'bp' },
    { n:'心率', t:'num', unit:'次/分' },
    { n:'心律', t:'choice', opts:[['窦性',1],['房颤',0],['室上速',0],['室性心律失常',0],['起搏心律',0]] },
    { n:'乳酸', t:'num', unit:'mmol/L' },
    { n:'CVP', t:'num', unit:'cmH₂O' },
    { n:'末梢灌注', t:'choice', opts:[['温暖',1],['湿冷',0],['花斑',0]] },
    '血管活性药物及剂量增减' ] },
  { key:'renal', name:'液体与肾脏', items:[
    { n:'24h入量', t:'num', unit:'ml' },
    { n:'24h尿量', t:'num', unit:'ml' },
    { n:'血钾 K⁺', t:'num', unit:'mmol/L' },
    { n:'血钠 Na⁺', t:'num', unit:'mmol/L' },
    { n:'肌酐 Cr', t:'num', unit:'μmol/L' },
    { n:'容量管理', t:'choice', opts:[['出入平衡',1],['补液为主',0],['脱水/利尿',0],['CRRT',0]] },
    '尿色性状 / 其他电解质（Ca Mg P）' ] },
  { key:'gi', name:'消化与营养', items:[
    { n:'肠鸣音', t:'choice', opts:[['正常',1],['活跃',0],['减弱',0],['消失',0]] },
    { n:'大便情况', t:'choice', opts:[['正常',1],['未解',0],['腹泻',0],['黑便/血便',0],['便秘',0]] },
    { n:'腹内压', t:'num', unit:'mmHg' },
    { n:'白蛋白', t:'num', unit:'g/L' },
    { n:'肠内营养', t:'choice', opts:[['达标',1],['未达标',0],['不耐受',0],['暂停',0],['未开始',0]] },
    '营养方案（速度/量）/ 肝功能胆红素 / 应激性溃疡预防' ] },
  { key:'heme', name:'血液凝血', items:[
    { n:'Hb', t:'num', unit:'g/L' },
    { n:'PLT', t:'num', unit:'×10⁹/L' },
    { n:'活动性出血', t:'choice', opts:[['无',1],['有',0]] },
    { n:'DVT预防', t:'choice', opts:[['药物预防',1],['机械预防',1],['未预防',0]] },
    'PT / APTT / D-二聚体 / 输血指征评估' ] },
  { key:'endo', name:'内分泌代谢', items:[
    { n:'血糖（最高）', t:'num', unit:'mmol/L' },
    { n:'体温（最高）', t:'num', unit:'℃' },
    { n:'酸碱平衡', t:'multi', opts:[['无紊乱',1],['代酸',0],['呼酸',0],['代碱',0],['呼碱',0]] },
    '胰岛素方案 / 控温措施 / 特殊（甲亢、肾上腺等）' ] },
  { key:'inf', name:'感染', items:[
    { n:'PCT', t:'num', unit:'ng/mL' },
    { n:'CRP', t:'num', unit:'mg/L' },
    { n:'WBC', t:'num', unit:'×10⁹/L' },
    { n:'目前抗感染方案', t:'text' },
    '感染灶排查 / 培养结果与药敏 / 抗生素升降级与疗程 / 导管相关感染、口腔护理' ] },
  { key:'skin', name:'皮肤与康复', items:[
    { n:'压疮', t:'choice', opts:[['无',1],['Ⅰ期',0],['Ⅱ期',0],['Ⅲ期',0],['Ⅳ期',0],['不可分期',0]] },
    { n:'保护性约束', t:'choice', opts:[['无约束',1],['有约束',0]] },
    { n:'DVT体征', t:'choice', opts:[['无',1],['有',0]] },
    { n:'早期活动/康复', t:'choice', opts:[['主动活动',1],['被动活动',0],['未开展',0]] },
    '皮肤情况 / 体位翻身 / 睡眠与人文关怀' ] },
  { key:'med',    name:'药物重整', items:[
    { n:'目前用药情况', t:'text' },
    '医嘱逐条核对 / 重复与相互作用', '肝肾功剂量调整', '今日新增 / 停用药物', '过敏史核对' ] },
  { key:'tube', name:'管路盘点', items:[
    { n:'气管插管 / 气切导管', t:'tube', ph:'经口/经鼻、置入时间与深度、气囊压、可否拔管评估…' },
    { n:'中心静脉导管', t:'tube', ph:'部位（颈内/锁骨下/股）、置入时间、局部有无红肿渗液…' },
    { n:'动脉置管', t:'tube', ph:'部位（桡动脉/足背/股）、置入时间、波形…' },
    { n:'尿管', t:'tube', ph:'置入时间、尿色性状、可否拔除评估…' },
    { n:'胃管', t:'tube', ph:'置入时间、深度、喂养与耐受情况…' },
    { n:'引流管', t:'tube', ph:'部位、引流量、颜色、性状…' } ] },
  { key:'prog', name:'沟通与预后', items:[
    '病情告知、家属理解', '知情同意是否齐全', '预后与风险分层', '出院 / 转科预判', '伦理 / 放弃抢救意向' ] },
  { key:'tcm', name:'中医', items:[
    { n:'四诊（望闻问切）', t:'text' },
    { n:'治则治法', t:'text' },
    { n:'中药方剂', t:'rx' } ] },
];

// ---------- 数据层 ----------
const LS_KEY = 'carelist_data_v2';
let db = load();
if (!db.library) db.library = [];

function load(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {patients:[]}; }
  catch(e){ return {patients:[]}; }
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(db)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dayNum(patient, dateStr){
  const a = new Date(patient.admit + 'T00:00:00');
  const b = new Date(dateStr + 'T00:00:00');
  return Math.round((b - a) / 86400000) + 1;
}
function getPatient(id){ return db.patients.find(p => p.id === id); }

// 单个系统的数据结构：每项 { s: ''|'n'|'a'（未评/正常/异常）, v: 填写内容 }，附加栏 note
function blankSysData(){ return { items:{}, note:'' }; }
function normSysData(sd){
  if (!sd) return blankSysData();
  if (!sd.items) sd.items = {};
  if (typeof sd.note !== 'string') sd.note = '';
  return sd;
}
// 统计某系统已填项数（评估选项或内容有值即算 1 项；附加栏有值再 +1）
function sysFilledCount(sd){
  sd = normSysData(sd);
  let n = 0;
  Object.values(sd.items).forEach(it => { if ((it && it.s) || (it && (it.v||'').trim())) n++; });
  if (sd.note.trim()) n++;
  return n;
}

// ---------- 视图路由 ----------
const views = ['home','discharged','patient','pform','carelist','library'];
let cur = { view:'home', patientId:null, clDate:null, editingPatientId:null };

function show(view){
  views.forEach(v => document.getElementById('view-' + v).classList.toggle('active', v === view));
  cur.view = view;
  document.getElementById('bottom-nav').style.display =
    (view === 'home' || view === 'discharged' || view === 'library') ? 'flex' : 'none';
  document.querySelectorAll('.bottom-nav .nav-item').forEach(n =>
    n.classList.toggle('active', n.dataset.nav === view));
  if (view === 'home') renderActive();
  if (view === 'discharged') renderDischarged();
  if (view === 'patient') renderPatient();
  if (view === 'library') renderLibrary();
  window.scrollTo(0,0);
}

document.querySelectorAll('.bottom-nav .nav-item').forEach(n =>
  n.addEventListener('click', () => show(n.dataset.nav)));
document.querySelector('[data-nav="home"].back-btn').addEventListener('click', () => show('home'));

// ---------- 渲染：患者列表 ----------
function patientCard(p, isOut){
  const div = document.createElement('div');
  div.className = 'pcard';
  const d = dayNum(p, todayStr());
  div.innerHTML =
    '<div class="avatar">' + escapeHtml(p.name.charAt(0)) + '</div>' +
    '<div class="info">' +
      '<div class="row1">' + escapeHtml(p.name) +
        '<span class="bed">' + escapeHtml(p.bed) + '</span>' +
        (isOut ? '<span class="badge-out">已出</span>' : '') + '</div>' +
      '<div class="row2">入院 ' + p.admit + (isOut ? '' : ' · 第' + d + '天') + '</div>' +
      '<div class="row2">' + escapeHtml(p.diag) + '</div>' +
    '</div>' +
    '<button class="share-btn" title="分享该患者数据包">↗</button>' +
    '<div class="chev">›</div>';
  div.querySelector('.share-btn').addEventListener('click', e => {
    e.stopPropagation();
    exportPatientPackage(p.id);
  });
  div.addEventListener('click', () => { cur.patientId = p.id; show('patient'); });
  return div;
}
function ptMatches(p, q){
  if (!q) return true;
  return ((p.name||'') + (p.bed||'') + (p.diag||'') + (p.hospno||'')).toLowerCase().includes(q);
}
function renderActive(){
  const box = document.getElementById('active-list');
  box.innerHTML = '';
  const q = (document.getElementById('pt-search').value || '').trim().toLowerCase();
  const list = db.patients.filter(p => p.status === 'active' && ptMatches(p, q));
  if (!list.length){
    box.innerHTML = '<div class="empty">' + (q ? '没有找到匹配的患者' : '暂无在科患者<br>点击右下角 ＋ 新建患者<br>或点右上角「导入」接收数据包') + '</div>';
    return;
  }
  list.forEach(p => box.appendChild(patientCard(p, false)));
}
function renderDischarged(){
  const box = document.getElementById('discharged-list');
  box.innerHTML = '';
  const q = (document.getElementById('pt-search-out').value || '').trim().toLowerCase();
  const list = db.patients.filter(p => p.status === 'discharged' && ptMatches(p, q));
  if (!list.length){
    box.innerHTML = '<div class="empty">' + (q ? '没有找到匹配的患者' : '暂无已出院 / 转科患者') + '</div>';
    return;
  }
  list.forEach(p => box.appendChild(patientCard(p, true)));
}
document.getElementById('pt-search').addEventListener('input', renderActive);
document.getElementById('pt-search-out').addEventListener('input', renderDischarged);

// ---------- 渲染：患者详情 ----------
function renderPatient(){
  const p = getPatient(cur.patientId);
  if (!p){ show('home'); return; }
  document.getElementById('pd-title').textContent = p.name + ' · ' + p.bed;
  document.getElementById('pd-info').innerHTML =
    '<div class="p-name">' + escapeHtml(p.name) + '　<span style="font-size:14px;font-weight:500;">' + escapeHtml(p.bed) + '</span></div>' +
    '<div class="p-meta">' +
      (p.gender || '') + (p.age ? ' / ' + p.age + '岁' : '') +
      (p.hospno ? '　住院号 ' + escapeHtml(p.hospno) : '') + '<br>' +
      '入院：' + p.admit + '（第 ' + dayNum(p, todayStr()) + ' 天）<br>' +
      '诊断：' + escapeHtml(p.diag) +
      (p.hpi ? '<br>现病史：' + escapeHtml(p.hpi) : '') +
      (p.pasthx ? '<br>既往史：' + escapeHtml(p.pasthx) : '') +
      (p.doctor ? '<br>主管医师：' + escapeHtml(p.doctor) : '') +
      (p.status === 'discharged' ? '<br>出科日期：' + (p.outDate || '') : '') +
    '</div>';

  const btnD = document.getElementById('btn-discharge');
  btnD.textContent = p.status === 'active' ? '出院/转科' : '转回在科';

  const t = todayStr();
  document.getElementById('btn-new-carelist').textContent =
    p.careLists && p.careLists[t] ? '继续填写今日 CARE LIST（第' + dayNum(p,t) + '天）' : '＋ 填写今日 CARE LIST（第' + dayNum(p,t) + '天）';

  const box = document.getElementById('cl-entries');
  box.innerHTML = '';
  const dates = Object.keys(p.careLists || {}).sort().reverse();
  if (!dates.length){
    box.innerHTML = '<div class="empty">还没有 CARE LIST 记录</div>';
    return;
  }
  dates.forEach(dateStr => {
    const cl = p.careLists[dateStr];
    const item = document.createElement('div');
    item.className = 'cl-item';
    const filled = SYSTEMS.filter(s => sysFilledCount(cl.systems && cl.systems[s.key]) > 0).length;
    item.innerHTML =
      '<div class="day-num"><div class="d1">第</div><div class="d2">' + dayNum(p,dateStr) + '</div><div class="d1">天</div></div>' +
      '<div class="cl-info"><div class="cl-date">' + dateStr +
        (dateStr === t ? '<span class="today-tag">今天</span>' : '') + '</div>' +
      '<div class="cl-meta">已评估 ' + filled + '/' + SYSTEMS.length + ' 系统' + (cl.fillTime ? ' · ' + cl.fillTime : '') + '</div></div>' +
      '<div class="chev">›</div>';
    item.addEventListener('click', () => openCareList(p.id, dateStr));
    box.appendChild(item);
  });
}

// ---------- 患者表单 ----------
function openPatientForm(editId){
  cur.editingPatientId = editId || null;
  document.getElementById('pform-title').textContent = editId ? '编辑患者' : '新建患者';
  document.getElementById('pf-delete').style.display = editId ? 'block' : 'none';
  const p = editId ? getPatient(editId) : null;
  document.getElementById('pf-name').value   = p ? p.name : '';
  document.getElementById('pf-bed').value    = p ? p.bed : '';
  document.getElementById('pf-gender').value = p ? (p.gender||'男') : '男';
  document.getElementById('pf-age').value    = p ? (p.age||'') : '';
  document.getElementById('pf-hospno').value = p ? (p.hospno||'') : '';
  document.getElementById('pf-doctor').value = p ? (p.doctor||'') : '';
  document.getElementById('pf-admit').value  = p ? p.admit : todayStr();
  document.getElementById('pf-diag').value   = p ? p.diag : '';
  document.getElementById('pf-hpi').value    = p ? (p.hpi||'') : '';
  document.getElementById('pf-past').value   = p ? (p.pasthx||'') : '';
  show('pform');
}
document.getElementById('fab-add').addEventListener('click', () => openPatientForm(null));
document.getElementById('btn-edit-patient').addEventListener('click', () => openPatientForm(cur.patientId));
document.getElementById('pform-back').addEventListener('click', () => {
  show(cur.editingPatientId ? 'patient' : 'home');
});

document.getElementById('pf-save').addEventListener('click', () => {
  const name  = document.getElementById('pf-name').value.trim();
  const bed   = document.getElementById('pf-bed').value.trim();
  const admit = document.getElementById('pf-admit').value;
  const diag  = document.getElementById('pf-diag').value.trim();
  if (!name || !bed || !admit || !diag){ toast('请填写：姓名、床号、入院时间、入院诊断'); return; }
  const data = {
    name, bed, admit, diag,
    gender: document.getElementById('pf-gender').value,
    age:    document.getElementById('pf-age').value.trim(),
    hospno: document.getElementById('pf-hospno').value.trim(),
    doctor: document.getElementById('pf-doctor').value.trim(),
    hpi:    document.getElementById('pf-hpi').value.trim(),
    pasthx: document.getElementById('pf-past').value.trim(),
  };
  if (cur.editingPatientId){
    Object.assign(getPatient(cur.editingPatientId), data);
    save(); toast('已保存');
    cur.patientId = cur.editingPatientId;
    show('patient');
  } else {
    const p = Object.assign({ id: uid(), status:'active', careLists:{} }, data);
    db.patients.push(p); save(); toast('已新建患者');
    cur.patientId = p.id;
    show('patient');
  }
});

document.getElementById('pf-delete').addEventListener('click', () => {
  if (!confirm('确定删除该患者及其全部 CARE LIST 记录？此操作不可恢复。')) return;
  db.patients = db.patients.filter(p => p.id !== cur.editingPatientId);
  save(); toast('已删除'); show('home');
});

// ---------- 出院 / 转回 ----------
document.getElementById('btn-discharge').addEventListener('click', () => {
  const p = getPatient(cur.patientId);
  if (p.status === 'active'){
    if (!confirm('将「' + p.name + '」标记为出院/转科，移入"已出患者"？')) return;
    p.status = 'discharged'; p.outDate = todayStr();
    save(); toast('已移入已出患者'); show('discharged');
  } else {
    p.status = 'active'; delete p.outDate;
    save(); toast('已转回在科'); show('home');
  }
});

// ---------- 患者数据包：分享 / 导入 ----------
function buildPatientPackage(p){
  return {
    app: 'carelist',
    type: 'patient-package',
    version: 1,
    exportedAt: new Date().toISOString(),
    patient: JSON.parse(JSON.stringify(p))
  };
}

function exportPatientPackage(pid){
  const p = getPatient(pid);
  if (!p){ toast('患者不存在'); return; }
  const pkg = buildPatientPackage(p);
  const fname = 'CARELIST数据包_' + p.name + '_' + p.bed + '.json';
  const blob = new Blob([JSON.stringify(pkg, null, 2)], { type:'application/json' });
  const file = new File([blob], fname, { type:'application/json' });
  // 手机端优先调起系统分享（微信等），不支持则下载
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    navigator.share({ files:[file], title:'CARE LIST 患者数据包', text: p.name + ' ' + p.bed + ' 的数据包' })
      .then(() => toast('已分享'))
      .catch(err => { if (err && err.name !== 'AbortError') downloadBlob(blob, fname); });
  } else {
    downloadBlob(blob, fname);
    toast('数据包已下载，可发送给其他用户');
  }
}
function downloadBlob(blob, fname){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

document.getElementById('btn-share-patient').addEventListener('click', () =>
  exportPatientPackage(cur.patientId));

// 同一患者判定：住院号相同（双方都有）优先，否则 姓名+床号 相同
function isSamePatient(a, b){
  if (a.hospno && b.hospno && a.hospno === b.hospno) return true;
  return a.name === b.name && a.bed === b.bed;
}

function importPatientPackage(obj){
  if (!obj || obj.app !== 'carelist'){
    toast('文件格式不正确，不是 CARE LIST 数据包'); return;
  }
  if (obj.type === 'full-backup'){ restoreFullBackup(obj); return; }
  if (obj.type !== 'patient-package' || !obj.patient){
    toast('文件格式不正确，不是 CARE LIST 数据包'); return;
  }
  const inc = obj.patient;
  if (!inc.name || !inc.bed){ toast('数据包缺少患者姓名或床号'); return; }
  if (!inc.careLists) inc.careLists = {};

  const existing = db.patients.find(p => isSamePatient(p, inc));
  if (existing){
    // 已存在 → 自动更新：基本信息以导入为准（保留本机 id），CARE LIST 按日期合并（导入覆盖同日）
    const keepId = existing.id;
    const mergedCL = Object.assign({}, existing.careLists, inc.careLists);
    Object.assign(existing, inc, { id: keepId, careLists: mergedCL });
    save();
    toast('已更新患者「' + existing.name + '」的数据');
  } else {
    inc.id = uid();
    if (!inc.status) inc.status = 'active';
    db.patients.push(inc);
    save();
    toast('已导入新患者「' + inc.name + '」');
  }
  if (cur.view === 'home') renderActive();
  else if (cur.view === 'discharged') renderDischarged();
  else if (cur.view === 'patient') renderPatient();
  else show('home');
}

document.getElementById('btn-import').addEventListener('click', () =>
  document.getElementById('import-file').click());
document.getElementById('import-file').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{ importPatientPackage(JSON.parse(reader.result)); }
    catch(err){ toast('文件解析失败：不是有效的 JSON 文件'); }
  };
  reader.onerror = () => toast('文件读取失败');
  reader.readAsText(file);
});

// ---------- 整机备份 / 恢复 ----------
document.getElementById('btn-backup').addEventListener('click', () => {
  const pkg = {
    app: 'carelist',
    type: 'full-backup',
    version: 1,
    exportedAt: new Date().toISOString(),
    data: JSON.parse(JSON.stringify(db))
  };
  const blob = new Blob([JSON.stringify(pkg)], { type:'application/json' });
  downloadBlob(blob, 'CARELIST_整机备份_' + todayStr() + '.json');
  toast('已导出整机备份（含 ' + db.patients.length + ' 名患者）');
});

// 整机恢复：按患者合并（不删除本机多出的患者；同患者按日期合并，备份覆盖同日）
function restoreFullBackup(obj){
  const data = obj.data;
  if (!data || !Array.isArray(data.patients)){ toast('备份文件内容不完整'); return; }
  let added = 0, updated = 0;
  data.patients.forEach(inc => {
    if (!inc || !inc.name || !inc.bed) return;
    if (!inc.careLists) inc.careLists = {};
    const existing = db.patients.find(p => isSamePatient(p, inc));
    if (existing){
      const keepId = existing.id;
      const mergedCL = Object.assign({}, existing.careLists, inc.careLists);
      Object.assign(existing, inc, { id: keepId, careLists: mergedCL });
      updated++;
    } else {
      inc.id = uid();
      if (!inc.status) inc.status = 'active';
      db.patients.push(inc);
      added++;
    }
  });
  // 文献库合并（备份版本优先）
  if (Array.isArray(data.library)){
    if (!db.library) db.library = [];
    data.library.forEach(l => {
      if (!l || !l.title) return;
      const ex = db.library.find(x => x.id === l.id);
      if (ex) Object.assign(ex, l);
      else db.library.push(l);
    });
  }
  save();
  if (cur.view === 'home') renderActive();
  else if (cur.view === 'discharged') renderDischarged();
  else if (cur.view === 'patient') renderPatient();
  else if (cur.view === 'library') renderLibrary();
  toast('备份已恢复：新增 ' + added + ' 名，更新 ' + updated + ' 名');
}

// ---------- 智能辅助决策 ----------
function buildAIText(){
  const { p, cl, dn } = buildExportData();
  let out = '';
  out += '【临床辅助决策咨询请求】\n';
  out += '==========================================\n';
  out += '一、患者基本信息\n';
  out += '床号：' + p.bed + '　性别：' + (p.gender || '—') + (p.age ? '　年龄：' + p.age + '岁' : '') + '\n';
  out += '入院时间：' + p.admit + '（住院第 ' + dn + ' 天）\n';
  out += '入院诊断：\n' + formatDiagNum(p.diag) + '\n';
  if (p.hpi && p.hpi.trim()) out += '现病史：' + p.hpi.trim() + '\n';
  if (p.pasthx && p.pasthx.trim()) out += '既往史：' + p.pasthx.trim() + '\n';
  out += '==========================================\n';
  out += '二、今日最主要问题\n';
  let anyProb = false;
  cl.problems.forEach((pr, i) => {
    if (pr.trim()){ out += '  ' + (i + 1) + '. ' + pr.trim() + '\n'; anyProb = true; }
  });
  if (!anyProb) out += '  （未填写）\n';
  out += '三、今日辅助检查结果\n';
  out += (cl.recheck.trim() || '（未填写）') + '\n';
  out += '==========================================\n';
  out += '请结合以上信息：\n';
  out += '1. 给出主要的鉴别诊断思路与诊疗建议（含需重点监测的病情变化指标）；\n';
  out += '2. 检索并推荐相关的临床指南、专家共识与高质量文献（注明出处与年份），并说明推荐理由；\n';
  out += '3. 指出当前诊疗中可能遗漏或需警惕的问题。\n';
  return out;
}

// ---------- 文献参考库 ----------
let editingLitId = null;
function renderLibrary(){
  const q = (document.getElementById('lit-search').value || '').trim().toLowerCase();
  const box = document.getElementById('lit-list');
  box.innerHTML = '';
  let list = db.library.slice().sort((a, b) => (b.addedAt||'').localeCompare(a.addedAt||''));
  if (q) list = list.filter(l => ((l.title + l.src + l.tag + l.note).toLowerCase().includes(q)));
  if (!list.length){
    box.innerHTML = '<div class="empty">' + (q ? '没有匹配的文献' : '还没有收藏文献<br>点右上角「＋ 添加文献」记录指南与文献') + '</div>';
    return;
  }
  list.forEach(l => {
    const card = document.createElement('div');
    card.className = 'pcard';
    card.innerHTML =
      '<div class="info">' +
        '<div class="row1">' + escapeHtml(l.title) + '　<span class="badge-out">' + escapeHtml(l.tag||'其他') + '</span></div>' +
        '<div class="row2">' + escapeHtml(l.src||'来源未填') + ' · ' + (l.addedAt||'').slice(0,10) + '</div>' +
        (l.note ? '<div class="row2">' + escapeHtml(l.note.length > 60 ? l.note.slice(0,60) + '…' : l.note) + '</div>' : '') +
      '</div><div class="ops">›</div>';
    card.addEventListener('click', () => openLitForm(l.id));
    box.appendChild(card);
  });
}
document.getElementById('lit-search').addEventListener('input', renderLibrary);
document.getElementById('btn-add-lit').addEventListener('click', () => openLitForm(null));
function openLitForm(id){
  editingLitId = id;
  const l = id ? db.library.find(x => x.id === id) : null;
  document.getElementById('lit-mtitle').textContent = l ? '编辑文献' : '添加文献';
  document.getElementById('lit-title').value = l ? l.title : '';
  document.getElementById('lit-tag').value   = l ? (l.tag||'其他') : '指南';
  document.getElementById('lit-src').value   = l ? (l.src||'') : '';
  document.getElementById('lit-url').value   = l ? (l.url||'') : '';
  document.getElementById('lit-note').value  = l ? (l.note||'') : '';
  document.getElementById('lit-del').style.display = l ? 'block' : 'none';
  document.getElementById('lit-mask').classList.add('show');
}
document.getElementById('lit-save').addEventListener('click', () => {
  const title = document.getElementById('lit-title').value.trim();
  if (!title){ toast('请填写标题'); return; }
  const data = {
    title,
    tag:  document.getElementById('lit-tag').value,
    src:  document.getElementById('lit-src').value.trim(),
    url:  document.getElementById('lit-url').value.trim(),
    note: document.getElementById('lit-note').value.trim(),
  };
  if (editingLitId){
    Object.assign(db.library.find(x => x.id === editingLitId), data);
    toast('已更新文献');
  } else {
    data.id = uid(); data.addedAt = new Date().toISOString();
    db.library.push(data);
    toast('已加入文献库');
  }
  save();
  document.getElementById('lit-mask').classList.remove('show');
  renderLibrary();
});
document.getElementById('lit-del').addEventListener('click', () => {
  db.library = db.library.filter(x => x.id !== editingLitId);
  save();
  document.getElementById('lit-mask').classList.remove('show');
  renderLibrary();
  toast('已删除');
});
document.getElementById('lit-cancel').addEventListener('click', () =>
  document.getElementById('lit-mask').classList.remove('show'));

// ---------- CARE LIST 表单 ----------
function blankCL(){
  const systems = {};
  SYSTEMS.forEach(s => systems[s.key] = blankSysData());
  return { problems:['',''], systems, recheck:'', communication:'', plan:'', signature:'', fillTime:'' };
}

function openCareList(pid, dateStr){
  cur.patientId = pid; cur.clDate = dateStr;
  const p = getPatient(pid);
  if (!p){ toast('患者不存在'); show('home'); return; }
  if (!p.careLists) p.careLists = {};
  let inheritedFrom = null;
  if (!p.careLists[dateStr]) {
    // 昨日继承：自动带出最近一次记录，只需修改今日变化
    const prev = Object.keys(p.careLists).filter(d => d < dateStr).sort().pop();
    if (prev){
      const copy = JSON.parse(JSON.stringify(p.careLists[prev]));
      copy.plan = ''; copy.fillTime = '';
      p.careLists[dateStr] = copy;
      inheritedFrom = prev;
    } else {
      p.careLists[dateStr] = blankCL();
    }
  }
  if (!p.careLists[dateStr].systems) p.careLists[dateStr].systems = {};
  let pr = Array.isArray(p.careLists[dateStr].problems) ? p.careLists[dateStr].problems : [];
  pr = pr.slice(0, 2); while (pr.length < 2) pr.push('');
  p.careLists[dateStr].problems = pr;
  // 兼容旧数据结构
  SYSTEMS.forEach(s => { p.careLists[dateStr].systems[s.key] = normSysData(p.careLists[dateStr].systems[s.key]); });
  renderCLForm();
  show('carelist');
  if (inheritedFrom) toast('已带入 ' + inheritedFrom + ' 的记录，请修改今日变化');
}

document.getElementById('btn-new-carelist').addEventListener('click', () =>
  openCareList(cur.patientId, todayStr()));

function renderCLForm(){
  const p = getPatient(cur.patientId);
  if (!p || !p.careLists || !p.careLists[cur.clDate]){ show('home'); return; }
  const cl = p.careLists[cur.clDate];
  const dn = dayNum(p, cur.clDate);
  document.getElementById('cl-title').textContent = '第' + dn + '天 CARE LIST';
  const wrap = document.getElementById('cl-form');
  wrap.innerHTML = '';

  // —— 基本信息（自动带入） ——
  const info = document.createElement('div');
  info.className = 'f-card';
  info.innerHTML =
    '<div class="f-title">基本信息<span class="tip">自动带入患者资料</span></div>' +
    '<div class="f-row">' +
      '<div class="f-field"><label>姓名</label><input value="' + escapeAttr(p.name) + '" disabled></div>' +
      '<div class="f-field"><label>床号</label><input value="' + escapeAttr(p.bed) + '" disabled></div>' +
    '</div><div class="f-row">' +
      '<div class="f-field"><label>性别 / 年龄</label><input value="' + escapeAttr((p.gender||'') + (p.age ? ' / ' + p.age + '岁' : '')) + '" disabled></div>' +
      '<div class="f-field"><label>住院号</label><input value="' + escapeAttr(p.hospno||'') + '" disabled></div>' +
    '</div><div class="f-row">' +
      '<div class="f-field"><label>评估日期</label><input id="cl-date" type="date" value="' + cur.clDate + '"></div>' +
      '<div class="f-field"><label>住院第几天</label><input value="第 ' + dn + ' 天" disabled></div>' +
    '</div><div class="f-row">' +
      '<div class="f-field"><label>入院诊断</label><textarea class="diag-ta-ro" rows="' + Math.max(2, splitDiag(p.diag).length) + '" disabled>' + escapeHtml(formatDiagNum(p.diag)) + '</textarea></div>' +
      '<div class="f-field"><label>主管医师</label><input value="' + escapeAttr(p.doctor||'') + '" disabled></div>' +
    '</div>';
  wrap.appendChild(info);

  info.querySelector('#cl-date').addEventListener('change', e => {
    const nd = e.target.value;
    if (!nd || nd === cur.clDate) return;
    if (p.careLists[nd]){ toast('该日期已有记录，已为你打开'); }
    else { p.careLists[nd] = p.careLists[cur.clDate]; delete p.careLists[cur.clDate]; }
    cur.clDate = nd; save(); renderCLForm();
  });

  // —— 一、今日最主要问题 ——
  const sec1 = document.createElement('div');
  sec1.className = 'f-card';
  sec1.innerHTML = '<div class="f-title">一、今日最主要问题<span class="tip">按优先级，最多2条</span></div>';
  cl.problems.forEach((val, i) => {
    const row = document.createElement('div');
    row.className = 'f-row';
    row.innerHTML = '<div class="f-field"><label>主要问题 ' + (i+1) + '</label>' +
      '<input data-prob="' + i + '" value="' + escapeAttr(val) + '" placeholder="主要问题 ' + (i+1) + '"></div>';
    sec1.appendChild(row);
  });
  wrap.appendChild(sec1);
  sec1.querySelectorAll('[data-prob]').forEach(inp =>
    inp.addEventListener('input', () => { cl.problems[+inp.dataset.prob] = inp.value; touch(cl); }));

  // —— 二、逐系统评估与处置（逐项填写 + 附加栏） ——
  const sec2 = document.createElement('div');
  sec2.className = 'f-card';
  sec2.innerHTML = '<div class="f-title">二、逐系统评估与处置<span class="tip">✓全正常一键完成；点异常自动展开；酸碱可多选；管路先确认有无</span></div>';

  SYSTEMS.forEach(sys => {
    const sd = normSysData(cl.systems[sys.key]);
    cl.systems[sys.key] = sd;

    const box = document.createElement('div');
    box.className = 'sys';
    box.dataset.syskey = sys.key;

    let itemsHtml = '';
    sys.items.forEach((def, i) => {
      if (typeof def === 'string') def = { n: def, t: 'eval' };
      const iv = sd.items[i] || { s:'', v:'' };
      const btns =
        '<span class="eval-group">' +
          '<button type="button" class="eval-btn' + (iv.s === 'n' ? ' on-normal' : '') + '" data-sys="' + sys.key + '" data-idx="' + i + '" data-val="n">正常</button>' +
          '<button type="button" class="eval-btn' + (iv.s === 'a' ? ' on-abnormal' : '') + '" data-sys="' + sys.key + '" data-idx="' + i + '" data-val="a">异常</button>' +
        '</span>';
      if (def.t === 'choice'){
        let chips = '';
        def.opts.forEach(op => {
          const on = iv.v === op[0];
          chips += '<button type="button" class="chip' + (on ? (op[1] ? ' on-n' : ' on-a') : '') +
            '" data-sys="' + sys.key + '" data-idx="' + i + '" data-op="' + escapeAttr(op[0]) + '" data-n="' + (op[1] ? '1' : '0') + '">' + op[0] + '</button>';
        });
        itemsHtml += '<div class="item-row"><div class="item-head"><span class="item-name-static">' + def.n + '</span></div>' +
          '<div class="chip-wrap">' + chips + '</div></div>';
      } else if (def.t === 'num'){
        itemsHtml += '<div class="item-row"><div class="item-head"><span class="item-name-static">' + def.n + '</span>' + btns + '</div>' +
          '<div class="num-wrap"><input type="number" step="any" class="num-input" data-sys="' + sys.key + '" data-idx="' + i + '" value="' + escapeAttr(iv.v) + '" placeholder="填数值">' +
          '<span class="num-unit">' + (def.unit || '') + '</span></div></div>';
      } else if (def.t === 'text' || def.t === 'rx'){
        const cls = def.t === 'rx' ? 'item-input ta rx-input' : 'item-input ta';
        const ph = def.t === 'rx'
          ? '处方示例：\n　　黄芪30g　党参15g　白术12g\n　　茯苓15g　陈皮9g　炙甘草6g\n　　3剂，水煎服，日一剂，早晚分服'
          : '填写：' + def.n + '…';
        const headExtra = def.t === 'rx'
          ? '<button type="button" class="rx-fmt-btn" data-sys="' + sys.key + '" data-idx="' + i + '" onclick="fmtRxClick(this)">✨ 自动排版</button>'
          : '';
        itemsHtml += '<div class="item-row"><div class="item-head"><span class="item-name-static">' + def.n + '</span>' + headExtra + '</div>' +
          '<textarea class="' + cls + '" data-sys="' + sys.key + '" data-idx="' + i + '" placeholder="' + escapeAttr(ph) + '">' + escapeHtml(iv.v) + '</textarea></div>';
      } else if (def.t === 'multi'){
        const sel = (iv.v||'').split('+').filter(Boolean);
        let chips = '';
        def.opts.forEach(op => {
          const on = sel.includes(op[0]);
          chips += '<button type="button" class="chip chip-multi' + (on ? (op[1] ? ' on-n' : ' on-a') : '') +
            '" data-sys="' + sys.key + '" data-idx="' + i + '" data-op="' + escapeAttr(op[0]) + '" data-n="' + (op[1] ? '1' : '0') + '">' + op[0] + '</button>';
        });
        itemsHtml += '<div class="item-row"><div class="item-head"><span class="item-name-static">' + def.n + '<span class="edit-hint">可多选</span></span></div>' +
          '<div class="chip-wrap">' + chips + '</div></div>';
      } else if (def.t === 'bp'){
        const parts = (iv.v||'').split('/');
        const mapV = (parts[0] && parts[1]) ? Math.round((+parts[0] + 2 * +parts[1]) / 3) : '';
        itemsHtml += '<div class="item-row"><div class="item-head"><span class="item-name-static">' + def.n + '（收缩压/舒张压）</span>' + btns + '</div>' +
          '<div class="num-wrap">' +
            '<input type="number" step="any" class="num-input bp-input" style="width:86px;" data-sys="' + sys.key + '" data-idx="' + i + '" data-part="s" value="' + escapeAttr(parts[0]||'') + '" placeholder="收缩压">' +
            '<span class="num-unit">/</span>' +
            '<input type="number" step="any" class="num-input bp-input" style="width:86px;" data-sys="' + sys.key + '" data-idx="' + i + '" data-part="d" value="' + escapeAttr(parts[1]||'') + '" placeholder="舒张压">' +
            '<span class="num-unit">mmHg</span>' +
            '<span class="num-unit" style="color:var(--teal);font-weight:700;">MAP <span class="map-val" data-sys="' + sys.key + '" data-idx="' + i + '">' + (mapV === '' ? '—' : mapV) + '</span> mmHg（自动计算）</span>' +
          '</div></div>';
      } else if (def.t === 'tube'){
        itemsHtml += '<div class="item-row"><div class="item-head"><span class="item-name-static">' + def.n + '</span>' +
          '<span class="eval-group">' +
            '<button type="button" class="chip' + (iv.v === '无' ? ' on-n' : '') + '" data-sys="' + sys.key + '" data-idx="' + i + '" data-op="无" data-n="1">无</button>' +
            '<button type="button" class="chip' + (iv.v === '有' ? ' on-a' : '') + '" data-sys="' + sys.key + '" data-idx="' + i + '" data-op="有" data-n="0">有</button>' +
          '</span></div>' +
          '<textarea class="item-input ta tube-detail' + (iv.v === '有' ? '' : ' hidden') + '" data-sys="' + sys.key + '" data-idx="' + i + '" placeholder="存在该管路 → 填写评估：' + escapeAttr(def.ph||'') + '">' + escapeHtml(iv.d||'') + '</textarea></div>';
      } else {
        const showInput = iv.s === 'a' || (iv.v||'').trim() !== '';
        itemsHtml += '<div class="item-row"><div class="item-head">' +
          '<span class="item-name" data-sys="' + sys.key + '" data-idx="' + i + '" title="点我可手动填写">' + def.n + '<span class="edit-hint">✎</span></span>' + btns + '</div>' +
          '<input class="item-input' + (showInput ? '' : ' hidden') + '" data-sys="' + sys.key + '" data-idx="' + i + '" value="' + escapeAttr(iv.v) + '" placeholder="填写：' + escapeAttr(def.n) + '…"></div>';
      }
    });

    const canOk = sys.items.some(d => typeof d === 'string' || !d.t || d.t === 'eval' || d.t === 'num' || d.t === 'choice' || d.t === 'multi' || d.t === 'bp');
    box.innerHTML =
      '<div class="sys-head"><div class="name">' + sys.name + '</div>' +
      (canOk ? '<button type="button" class="sys-ok-btn" data-sys="' + sys.key + '">✓ 全正常</button>' : '') +
      '<div class="stat"></div><div class="arrow">▶</div></div>' +
      '<div class="sys-body">' + itemsHtml +
        '<div class="extra-note f-field"><label>今日情况 / 异常 / 处置（附加栏）</label>' +
        '<textarea data-note="' + sys.key + '" placeholder="' + sys.name + '：补充今日情况、异常与处置…">' + escapeHtml(sd.note) + '</textarea></div>' +
      '</div>';
    box.querySelector('.sys-head').addEventListener('click', () => box.classList.toggle('open'));
    sec2.appendChild(box);
  });
  wrap.appendChild(sec2);

  // 输入框可见性：异常或有内容时显示，其余隐藏
  function updateInputVis(k, i, focusIt){
    const inp = sec2.querySelector('.item-input[data-sys="' + k + '"][data-idx="' + i + '"]');
    if (!inp) return;
    const it = cl.systems[k].items[i];
    const show = (it && it.s === 'a') || (it && (it.v||'').trim() !== '');
    inp.classList.toggle('hidden', !show);
    if (show && focusIt) inp.focus();
  }

  // 评估选项（正常/异常，再点一次取消）
  sec2.querySelectorAll('.eval-btn').forEach(btn => btn.addEventListener('click', () => {
    const k = btn.dataset.sys, i = btn.dataset.idx, val = btn.dataset.val;
    const sd = cl.systems[k];
    if (!sd.items[i]) sd.items[i] = { s:'', v:'' };
    const turningOn = sd.items[i].s !== val;
    sd.items[i].s = turningOn ? val : '';
    const newVal = sd.items[i].s;
    sec2.querySelectorAll('.eval-btn[data-sys="' + k + '"][data-idx="' + i + '"]').forEach(b => {
      b.classList.toggle('on-normal', newVal === 'n' && b.dataset.val === 'n');
      b.classList.toggle('on-abnormal', newVal === 'a' && b.dataset.val === 'a');
    });
    updateInputVis(k, i, newVal === 'a');
    touch(cl); refreshSysStats();
  }));

  // 一键：本系统全部正常（选项项自动选第一个正常选项；文本/处方项不动）
  sec2.querySelectorAll('.sys-ok-btn').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    const k = btn.dataset.sys;
    const sd = cl.systems[k];
    SYSTEMS.find(s => s.key === k).items.forEach((def, i) => {
      if (typeof def === 'string') def = { n: def, t: 'eval' };
      if (def.t === 'text' || def.t === 'rx' || def.t === 'tube') return;
      if (!sd.items[i]) sd.items[i] = { s:'', v:'' };
      sd.items[i].s = 'n';
      if (def.t === 'choice' || def.t === 'multi'){
        const norm = def.opts.find(o => o[1]);
        sd.items[i].v = norm ? norm[0] : '';
        sec2.querySelectorAll('.chip[data-sys="' + k + '"][data-idx="' + i + '"]').forEach(c => {
          c.classList.toggle('on-n', c.dataset.op === sd.items[i].v);
          c.classList.remove('on-a');
        });
      } else {
        sec2.querySelectorAll('.eval-btn[data-sys="' + k + '"][data-idx="' + i + '"]').forEach(b => {
          b.classList.toggle('on-normal', b.dataset.val === 'n');
          b.classList.toggle('on-abnormal', false);
        });
        if (def.t === 'eval') updateInputVis(k, i, false);
      }
    });
    const box = sec2.querySelector('.sys[data-syskey="' + k + '"]');
    if (box) box.classList.remove('open');
    touch(cl); refreshSysStats();
  }));

  // 点条目名：手动展开/收起填写框（正常项也想备注数值时用）
  sec2.querySelectorAll('.item-name').forEach(nm => nm.addEventListener('click', () => {
    const inp = sec2.querySelector('.item-input[data-sys="' + nm.dataset.sys + '"][data-idx="' + nm.dataset.idx + '"]');
    if (!inp) return;
    inp.classList.toggle('hidden');
    if (!inp.classList.contains('hidden')) inp.focus();
  }));

  // 逐项填写内容（排除管路详情框——它有独立的 d 字段处理器）
  sec2.querySelectorAll('.item-input:not(.tube-detail)').forEach(inp => inp.addEventListener('input', () => {
    const k = inp.dataset.sys, i = inp.dataset.idx;
    const sd = cl.systems[k];
    if (!sd.items[i]) sd.items[i] = { s:'', v:'' };
    sd.items[i].v = inp.value;
    touch(cl); refreshSysStats();
  }));

  // 数值项（GCS、SpO₂、乳酸等；bp 的两个输入走单独逻辑）
  sec2.querySelectorAll('.num-input:not(.bp-input)').forEach(inp => inp.addEventListener('input', () => {
    const k = inp.dataset.sys, i = inp.dataset.idx;
    const sd = cl.systems[k];
    if (!sd.items[i]) sd.items[i] = { s:'', v:'' };
    sd.items[i].v = inp.value;
    touch(cl); refreshSysStats();
  }));

  // 血压项：自动计算 MAP
  sec2.querySelectorAll('.bp-input').forEach(inp => inp.addEventListener('input', () => {
    const k = inp.dataset.sys, i = inp.dataset.idx;
    const sd = cl.systems[k];
    if (!sd.items[i]) sd.items[i] = { s:'', v:'' };
    const sInp = sec2.querySelector('.bp-input[data-sys="' + k + '"][data-idx="' + i + '"][data-part="s"]');
    const dInp = sec2.querySelector('.bp-input[data-sys="' + k + '"][data-idx="' + i + '"][data-part="d"]');
    const sv = sInp ? sInp.value.trim() : '', dv = dInp ? dInp.value.trim() : '';
    sd.items[i].v = (sv || dv) ? sv + '/' + dv : '';
    const mv = (sv && dv) ? Math.round((+sv + 2 * +dv) / 3) : '';
    const span = sec2.querySelector('.map-val[data-sys="' + k + '"][data-idx="' + i + '"]');
    if (span) span.textContent = mv === '' ? '—' : mv;
    touch(cl); refreshSysStats();
  }));

  // 管路评估详情
  sec2.querySelectorAll('.tube-detail').forEach(ta => ta.addEventListener('input', () => {
    const k = ta.dataset.sys, i = ta.dataset.idx;
    const sd = cl.systems[k];
    if (!sd.items[i]) sd.items[i] = { s:'', v:'' };
    sd.items[i].d = ta.value;
    touch(cl); refreshSysStats();
  }));

  // 选项项（单选：点选自动判定正常/异常；多选：可组合；管路：选「有」展开评估）
  sec2.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
    const k = ch.dataset.sys, i = ch.dataset.idx;
    const sd = cl.systems[k];
    if (!sd.items[i]) sd.items[i] = { s:'', v:'' };
    if (ch.classList.contains('chip-multi')){
      let sel = (sd.items[i].v||'').split('+').filter(Boolean);
      const op = ch.dataset.op;
      if (sel.includes(op)) sel = sel.filter(x => x !== op);
      else if (op === '无紊乱') sel = ['无紊乱'];
      else { sel = sel.filter(x => x !== '无紊乱'); sel.push(op); }
      sd.items[i].v = sel.join('+');
      const def = SYSTEMS.find(s => s.key === k).items[i];
      const abn = sel.some(o => { const f = def.opts.find(x => x[0] === o); return f && !f[1]; });
      sd.items[i].s = sel.length ? (abn ? 'a' : 'n') : '';
      sec2.querySelectorAll('.chip[data-sys="' + k + '"][data-idx="' + i + '"]').forEach(c => {
        const on = sel.includes(c.dataset.op), isN = c.dataset.n === '1';
        c.classList.toggle('on-n', on && isN);
        c.classList.toggle('on-a', on && !isN);
      });
    } else {
      const turningOn = sd.items[i].v !== ch.dataset.op;
      sd.items[i].v = turningOn ? ch.dataset.op : '';
      sd.items[i].s = turningOn ? (ch.dataset.n === '1' ? 'n' : 'a') : '';
      sec2.querySelectorAll('.chip[data-sys="' + k + '"][data-idx="' + i + '"]').forEach(c => {
        const on = turningOn && c.dataset.op === ch.dataset.op;
        c.classList.toggle('on-n', on && c.dataset.n === '1');
        c.classList.toggle('on-a', on && c.dataset.n !== '1');
      });
      const dt = sec2.querySelector('.tube-detail[data-sys="' + k + '"][data-idx="' + i + '"]');
      if (dt){
        dt.classList.toggle('hidden', sd.items[i].v !== '有');
        if (sd.items[i].v === '有') dt.focus();
      }
    }
    touch(cl); refreshSysStats();
  }));

  // 附加栏
  sec2.querySelectorAll('[data-note]').forEach(ta => ta.addEventListener('input', () => {
    cl.systems[ta.dataset.note].note = ta.value; touch(cl); refreshSysStats();
  }));

  function refreshSysStats(){
    sec2.querySelectorAll('.sys').forEach(box => {
      const k = box.dataset.syskey;
      const sd = cl.systems[k];
      const sys = SYSTEMS.find(s => s.key === k);
      const allNormal = sys.items.every((def, i) => {
        if (typeof def === 'string') def = { t:'eval' };
        if (def.t === 'text' || def.t === 'rx' || def.t === 'tube') return true;
        return sd.items[i] && sd.items[i].s === 'n';
      });
      const n = sysFilledCount(sd);
      const stat = box.querySelector('.stat');
      stat.textContent = allNormal ? '✓ 全部正常' : (n ? '已填 ' + n + ' 项' : '');
      stat.classList.toggle('has', n > 0);
      const okBtn = box.querySelector('.sys-ok-btn');
      if (okBtn) okBtn.classList.toggle('on', allNormal);
    });
  }
  refreshSysStats();

  // —— 三 / 四 / 五 ——
  const prevCLDate = Object.keys(p.careLists).filter(d => d < cur.clDate).sort().pop();
  const prevPlan = prevCLDate ? ((p.careLists[prevCLDate].plan || '').trim()) : '';
  const sec345 = document.createElement('div');
  sec345.innerHTML =
    '<div class="f-card"><div class="f-title">三、今日辅助检查结果</div>' +
      '<div class="f-field"><textarea id="cl-recheck" placeholder="今日已回报的化验、影像、心电图、床旁超声等结果…">' + escapeHtml(cl.recheck) + '</textarea></div></div>' +
    '<div class="f-card"><div class="f-title">四、家属沟通要点 / 知情同意</div>' +
      '<div class="f-field"><textarea id="cl-comm" placeholder="沟通对象、告知内容、家属态度、签字情况…">' + escapeHtml(cl.communication) + '</textarea></div></div>' +
    '<div class="f-card"><div class="f-title">五、明日计划 / 待办<span class="tip">脱机、拔管、减药、会诊等</span></div>' +
      '<div class="f-field"><textarea id="cl-plan" placeholder="' + escapeAttr(prevPlan ? '昨日计划：' + prevPlan : '明日计划与待办事项…') + '">' + escapeHtml(cl.plan) + '</textarea></div></div>' +
    '<div class="f-card"><div class="f-row">' +
      '<div class="f-field"><label>医师签名</label><input id="cl-sign" value="' + escapeAttr(cl.signature || p.doctor || '') + '"></div>' +
      '<div class="f-field"><label>填写时间</label><input id="cl-ftime" value="' + escapeAttr(cl.fillTime || nowTime()) + '"></div>' +
    '</div></div>';
  wrap.appendChild(sec345);

  sec345.querySelector('#cl-recheck').addEventListener('input', e => { cl.recheck = e.target.value; touch(cl); });
  sec345.querySelector('#cl-comm').addEventListener('input', e => { cl.communication = e.target.value; touch(cl); });
  sec345.querySelector('#cl-plan').addEventListener('input', e => { cl.plan = e.target.value; touch(cl); });
  sec345.querySelector('#cl-sign').addEventListener('input', e => { cl.signature = e.target.value; touch(cl); });
  sec345.querySelector('#cl-ftime').addEventListener('input', e => { cl.fillTime = e.target.value; touch(cl); });

  // —— 导出按钮 ——
  const expBtn = document.createElement('button');
  expBtn.className = 'btn btn-primary';
  expBtn.textContent = '📄 导出当日 CARE LIST';
  expBtn.addEventListener('click', () => {
    if (!cl.fillTime) { cl.fillTime = nowTime(); }
    save();
    document.getElementById('export-mask').classList.add('show');
  });
  wrap.appendChild(expBtn);

  const aiBtn = document.createElement('button');
  aiBtn.className = 'btn btn-outline';
  aiBtn.style.marginTop = '10px';
  aiBtn.textContent = '🤖 智能辅助决策';
  aiBtn.addEventListener('click', () => {
    save();
    document.getElementById('ai-mask').classList.add('show');
  });
  wrap.appendChild(aiBtn);

  const delBtn = document.createElement('button');
  delBtn.className = 'btn btn-danger';
  delBtn.style.marginTop = '10px';
  delBtn.textContent = '删除此日 CARE LIST';
  delBtn.addEventListener('click', () => {
    if (!confirm('删除 ' + cur.clDate + ' 的 CARE LIST？')) return;
    delete p.careLists[cur.clDate];
    save(); toast('已删除'); show('patient');
  });
  wrap.appendChild(delBtn);
}

function touch(cl){
  if (!cl.fillTime) cl.fillTime = nowTime();
  save();
}
function nowTime(){
  const d = new Date();
  return d.getMonth()+1 + '月' + d.getDate() + '日 ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

// ---------- 导出 ----------
function buildExportData(){
  const p = getPatient(cur.patientId);
  const cl = p && p.careLists ? p.careLists[cur.clDate] : null;
  return { p, cl, dn: p ? dayNum(p, cur.clDate) : 1 };
}

function evalLabel(s){ return s === 'n' ? '正常' : (s === 'a' ? '异常' : ''); }

// 条目结论/取值格式化（纯文本与 Word 导出共用）
function fmtItemLab(def, iv){
  if (def.t === 'tube') return iv.v === '无' ? '无' : (iv.v === '有' ? '有' : '');
  return evalLabel(iv.s);
}
function fmtItemVal(def, iv){
  let val = (iv.v||'').trim();
  if (!val) return '';
  if (def.t === 'num' && def.unit) return val + def.unit;
  if (def.t === 'bp'){
    const pp = val.split('/');
    if (pp[0] && pp[1]) return val + 'mmHg（MAP ' + Math.round((+pp[0] + 2 * +pp[1]) / 3) + 'mmHg）';
    return val + 'mmHg';
  }
  if (def.t === 'tube') return val === '有' ? (iv.d||'').trim() : '';
  return val;
}

// 纯文本版（喂 AI 最稳）
function buildPlainText(){
  const { p, cl, dn } = buildExportData();
  let out = '';
  out += '【ICU 重症患者每日系统评估与治疗清单（CARE LIST）】\n';
  out += '----------------------------------------\n';
  out += '姓名：' + p.name + '　床号：' + p.bed + '\n';
  out += '性别/年龄：' + (p.gender||'') + (p.age ? ' / ' + p.age + '岁' : '') + '　住院号：' + (p.hospno||'') + '\n';
  out += '评估日期：' + cur.clDate + '　住院第几天：第 ' + dn + ' 天\n';
  out += '入院诊断：\n' + formatDiagNum(p.diag) + '\n';
  out += '主管医师：' + (p.doctor||'') + '\n';
  if (p.hpi && p.hpi.trim()) out += '现病史：' + p.hpi.trim() + '\n';
  if (p.pasthx && p.pasthx.trim()) out += '既往史：' + p.pasthx.trim() + '\n';
  out += '----------------------------------------\n';
  out += '一、今日最主要问题（按优先级）\n';
  cl.problems.forEach((pr, i) => { if (pr.trim()) out += '  ' + (i+1) + '. ' + pr.trim() + '\n'; });
  out += '二、逐系统评估与处置\n';
  SYSTEMS.forEach(sys => {
    const sd = normSysData(cl.systems[sys.key]);
    const lines = [];
    sys.items.forEach((def, i) => {
      if (typeof def === 'string') def = { n: def };
      const iv = sd.items[i] || { s:'', v:'' };
      const lab = fmtItemLab(def, iv);
      const val = fmtItemVal(def, iv);
      if (lab || val) lines.push('  ' + def.n + '：' + (lab ? '［' + lab + '］' : '') + val);
    });
    if (!lines.length && !sd.note.trim()) return;
    out += '【' + sys.name + '】\n';
    lines.forEach(l => out += l + '\n');
    if (sd.note.trim()) out += '  今日情况/异常/处置（附加）：' + sd.note.trim() + '\n';
  });
  out += '三、今日辅助检查结果：' + (cl.recheck.trim() || '（未填写）') + '\n';
  out += '四、家属沟通要点/知情同意：' + (cl.communication.trim() || '（未填写）') + '\n';
  out += '五、明日计划/待办：' + (cl.plan.trim() || '（未填写）') + '\n';
  out += '----------------------------------------\n';
  out += '医师签名：' + (cl.signature||'') + '　填写时间：' + (cl.fillTime||'') + '\n';
  return out;
}

document.getElementById('exp-doc').addEventListener('click', () => {
  const { p, dn } = buildExportData();
  const blob = new Blob(['﻿' + buildDocHtml()], { type:'application/msword' });
  downloadBlob(blob, 'CARE LIST_' + p.name + '_第' + dn + '天_' + cur.clDate + '.doc');
  document.getElementById('export-mask').classList.remove('show');
  toast('已导出 Word 文档');
});

document.getElementById('exp-copy').addEventListener('click', () => {
  const text = buildPlainText();
  const done = () => { document.getElementById('export-mask').classList.remove('show'); toast('已复制，可直接粘贴给 AI'); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
});
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try{ document.execCommand('copy'); ok = true; }catch(e){}
  ta.remove();
  if (ok){ if (cb) cb(); else toast('已复制到剪贴板'); }
  else toast('复制失败，请使用导出文档');
}
document.getElementById('exp-cancel').addEventListener('click', () =>
  document.getElementById('export-mask').classList.remove('show'));

// ---------- 未填写提醒 ----------
function checkReminder(){
  const t = todayStr();
  const missing = db.patients.filter(p => p.status === 'active' && !(p.careLists && p.careLists[t]));
  if (!missing.length) return;
  document.getElementById('remind-date').textContent = t;
  const box = document.getElementById('remind-list');
  box.innerHTML = '';
  missing.forEach(p => {
    const item = document.createElement('div');
    item.className = 'remind-item';
    item.innerHTML =
      '<div class="r-info"><div class="r-name">' + escapeHtml(p.name) + '　' + escapeHtml(p.bed) + '</div>' +
      '<div class="r-meta">住院第 ' + dayNum(p, t) + ' 天 · ' + escapeHtml(p.diag) + '</div></div>' +
      '<button class="r-btn">去填写</button>';
    item.querySelector('.r-btn').addEventListener('click', () => {
      document.getElementById('remind-mask').classList.remove('show');
      openCareList(p.id, t);
    });
    box.appendChild(item);
  });
  document.getElementById('remind-mask').classList.add('show');
}
document.getElementById('remind-close').addEventListener('click', () =>
  document.getElementById('remind-mask').classList.remove('show'));

// ---------- 工具 ----------
function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escapeAttr(s){ return escapeHtml(s); }

// —— 诊断自动编号：按 分号/换行 拆分，逐条加序号 ——
function splitDiag(s){
  return String(s || '').split(/[\n；;]+/)
    .map(t => t.trim().replace(/^\d+[\.、．]\s*/, ''))
    .filter(Boolean);
}
function formatDiagNum(s){
  return splitDiag(s).map((t, i) => (i + 1) + '. ' + t).join('\n');
}

// —— 中药处方自动排版 ——
function fmtCharW(ch){ return /[\u2E80-\u9FFF\u3000-\u303F\uF900-\uFAFF\uFF01-\uFF60]/.test(ch) ? 2 : 1; }
function fmtWidth(s){ let w = 0; for (const ch of String(s)) w += fmtCharW(ch); return w; }
function padName(s, target){
  s = String(s);
  while (fmtWidth(s) + 2 <= target) s += '\u3000';
  if (fmtWidth(s) < target) s += ' ';
  return s;
}
const RX_USE_RE = /(水煎服|煎服|冲服|泡服|顿服|口服|日一剂|每日一剂|每日|隔日|温服|冷服|含服|代茶饮|频服|分服|早晚|饭后|睡前|\d+\s*剂)/;
const RX_NOTE_WORDS = /^(先煎|后下|冲服|烊化|包煎|另煎|泡服|兑服|捣碎|打碎|去核|切片|自备)$/;
function formatRx(text){
  const herbs = [], usage = [], other = [];
  String(text || '').split(/\n+/).forEach(line => {
    line.split(/[ \t\u3000、，,;；]+/).forEach(tok0 => {
      const tok = tok0.trim(); if (!tok) return;
      let body = tok, note = '';
      const pm = tok.match(/^(.+)[（(]([^）)]+)[）)]$/);
      if (pm){ body = pm[1]; note = pm[2]; }
      const hm = body.match(/^([\u4e00-\u9fa5〇A-Za-z]+)[\s:：]*(\d+(?:\.\d+)?)\s*(克|g|G|ｇ|kg|KG|毫升|ml|mL|枚|个|片|条|根|张|包|袋|支|瓶|丸|粒|块|滴|对|付|剂)?(.*)$/);
      if (hm){
        const name = hm[1], num = hm[2];
        let unit = hm[3] || '';
        const rest = hm[4] || '';
        if (/^(克|g|G|ｇ)$/i.test(unit)) unit = 'g';
        if (unit === '剂' || name === '共' || name === '合计'){ usage.push(tok); return; }
        if (rest && !/^(克|g|G|ｇ|kg|KG|毫升|ml|mL|枚|个|片|条|根|张|包|袋|支|瓶|丸|粒|块|滴|对|付)$/i.test(rest)){
          note = note ? note + '，' + rest : rest;
        }
        herbs.push({ name, num, unit: unit || 'g', note });
        return;
      }
      // 纯剂量单独成词（如"黄芪 30g"被拆开）：并入上一味药
      const dm = tok.match(/^(\d+(?:\.\d+)?)\s*(克|g|G|ｇ)?$/i);
      if (dm && herbs.length){
        const h = herbs[herbs.length - 1];
        h.num = dm[1]; h.unit = (dm[2] && !/^(克|g|G|ｇ)$/i.test(dm[2])) ? dm[2] : 'g';
        return;
      }
      // 独立的煎服备注词（如"冲服"）：并入上一味药
      if (RX_NOTE_WORDS.test(tok) && herbs.length){
        const h = herbs[herbs.length - 1];
        h.note = h.note ? h.note + '，' + tok : tok;
        return;
      }
      if (RX_USE_RE.test(tok)){ usage.push(tok); return; }
      if (/^[\u4e00-\u9fa5〇A-Za-z]{1,8}$/.test(tok)) herbs.push({ name: tok, num:'', unit:'', note:'' });
      else other.push(tok);
    });
  });
  if (!herbs.length && !usage.length && !other.length) return '';
  let max = 0; herbs.forEach(h => { max = Math.max(max, fmtWidth(h.name)); });
  const lines = herbs.map(h => {
    let s = padName(h.name, max);
    if (h.num) s += '\u3000' + h.num + h.unit;
    if (h.note) s += '（' + h.note + '）';
    return s;
  });
  if (usage.length) lines.push('', usage.join('，'));
  other.forEach(o => { lines.push('', o); });
  return lines.join('\n');
}
function fmtRxClick(btn){
  const ta = document.querySelector('textarea.rx-input[data-sys="' + btn.dataset.sys + '"][data-idx="' + btn.dataset.idx + '"]');
  if (!ta) return;
  const fmt = formatRx(ta.value);
  if (!fmt){ toast('请先输入处方内容'); return; }
  if (fmt === ta.value){ toast('排版已规整，无需调整'); return; }
  ta.value = fmt;
  ta.dispatchEvent(new Event('input', { bubbles: true }));
  toast('已自动排版');
}
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', 2200);
}

renderActive();
setTimeout(checkReminder, 400);
